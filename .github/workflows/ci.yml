name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run quick tests
        run: make test-quick
      
      - name: Run verification harness
        run: python3 -m pytest tests/test_verification_harness.py -v
      
      - name: Run Strategy F goal drift tests
        run: python3 -m pytest tests/test_strategy_f_goal_drift.py -v
      
      - name: Run Strategy I verification tests
        run: python3 -m pytest tests/test_strategy_i_verification.py -v
      
      - name: Run Strategy H verification tests
        run: python3 -m pytest tests/test_strategy_h_verification.py -v
